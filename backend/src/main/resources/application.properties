# public

# MySQL
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tailscale check (update to your targets)
tailscale.target.tangshan.name=\u5510\u5C71\u6570\u5B57\u4EBA
tailscale.target.tangshan.url=http://10.168.1.101/login
tailscale.target.tangshan.ip=10.168.1.101
tailscale.target.beijing.name=\u5317\u4EAC\u6570\u5B57\u4EBA
tailscale.target.beijing.url=http://10.168.1.105/login
tailscale.target.beijing.ip=10.168.1.105
tailscale.timeout.ms=8000

# Security (use env vars or application-local.properties)
app.jwt.secret=${JWT_SECRET}
app.init-admin.enabled=${INIT_ADMIN_ENABLED:false}
app.init-admin.username=${INIT_ADMIN_USERNAME:}
app.init-admin.password=${INIT_ADMIN_PASSWORD:}
spring.jpa.open-in-view=false
server.error.include-message=always
