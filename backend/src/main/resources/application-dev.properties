# Default local-development profile: no external MySQL or secrets required.
spring.datasource.url=jdbc:h2:mem:digitalhuman;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development-only key. Production must provide JWT_SECRET.
app.jwt.secret=development-only-jwt-secret-at-least-32-chars
app.init-admin.enabled=false
