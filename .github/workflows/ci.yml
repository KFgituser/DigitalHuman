name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI only compiles/tests the application; it does not connect to a real database.
      DB_URL: jdbc:mysql://127.0.0.1:3306/digitalhuman
      DB_USERNAME: ci
      DB_PASSWORD: ci
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Test
        run: ./mvnw --batch-mode test
      - name: Package
        run: ./mvnw --batch-mode package -DskipTests

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Test
        run: CI=true npm test -- --watchAll=false
      - name: Production build
        run: npm run build

  secret-guard:
    name: Guard local secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local configuration and credential files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(application-local\.properties|\.env|\.env\..+|.*密码.*\.txt)$'
          forbidden_files="$(git ls-files | grep -E "$forbidden" | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden_files" ]]; then
            printf '%s\n' "$forbidden_files"
            echo "Remove local configuration or credential files from Git history."
            exit 1
          fi
